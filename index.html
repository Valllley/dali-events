<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大理活动日历 | Dali Events</title>
  <meta name="description" content="大理旅居人群的活动信息聚合，实时更新市集、音乐、民俗、讲座等活动">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            dali: {
              sky: '#4A90D9',
              lake: '#5B9BD5',
              mountain: '#6B7280',
              terracotta: '#C4704B',
              gold: '#D4A574',
              cream: '#FDF8F0',
              warm: '#F9F0E7',
              rose: '#E8A0BF',
            }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap');
    body { font-family: 'Noto Serif SC', serif; }
    .font-sans { font-family: system-ui, -apple-system, sans-serif; }
    .category-pill { transition: all 0.2s ease; }
    .category-pill.active { transform: scale(1.05); }
    .event-card { transition: all 0.3s ease; }
    .event-card:hover { transform: translateY(-2px); }
    .featured-glow { box-shadow: 0 0 30px rgba(196, 112, 75, 0.15); }
    .date-badge { writing-mode: vertical-rl; text-orientation: mixed; }
    .fade-in { animation: fadeIn 0.5s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .modal-overlay { backdrop-filter: blur(4px); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #D4A574; border-radius: 3px; }
    ::-webkit-scrollbar-track { background: #FDF8F0; }
  </style>
</head>
<body class="bg-dali-cream min-h-screen">

  <!-- Header -->
  <header class="bg-gradient-to-r from-dali-terracotta/90 to-dali-gold/90 text-white">
    <div class="max-w-4xl mx-auto px-4 py-6">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-2xl md:text-3xl font-bold tracking-wide">🦋 大理活动日历</h1>
          <p class="text-sm md:text-base opacity-90 mt-1 font-sans">Dali Events · 旅居人群的活动信息站</p>
        </div>
        <div class="text-right font-sans">
          <div class="text-xs opacity-80">更新于</div>
          <div id="last-updated" class="text-sm font-medium">加载中...</div>
        </div>
      </div>
      <div class="mt-4 flex items-center gap-2 text-sm opacity-90 font-sans">
        <span>📅</span>
        <span id="date-range">加载中...</span>
        <span class="mx-1">·</span>
        <span id="event-count">0</span>个活动
      </div>
    </div>
  </header>

  <!-- Filter Bar -->
  <div class="sticky top-0 z-30 bg-dali-cream/95 backdrop-blur-sm border-b border-dali-gold/30 shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-3">
      <div id="filter-bar" class="flex gap-2 overflow-x-auto pb-1 scrollbar-hide font-sans">
        <!-- Generated by JS -->
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <main class="max-w-4xl mx-auto px-4 py-6">
    <!-- Featured -->
    <div id="featured-section" class="mb-8 hidden">
      <h2 class="text-lg font-bold text-dali-terracotta mb-3 flex items-center gap-2">
        <span>🔥</span> 本周重磅
      </h2>
      <div id="featured-events" class="space-y-3">
        <!-- Generated by JS -->
      </div>
    </div>

    <!-- Today -->
    <div id="today-section" class="mb-8 hidden">
      <h2 class="text-lg font-bold text-dali-sky mb-3 flex items-center gap-2">
        <span>📌</span> <span id="today-label">今天</span>
      </h2>
      <div id="today-events" class="space-y-3">
        <!-- Generated by JS -->
      </div>
    </div>

    <!-- Events by Date -->
    <div id="events-list" class="space-y-8">
      <!-- Generated by JS -->
    </div>

    <!-- Empty State -->
    <div id="empty-state" class="hidden text-center py-16">
      <div class="text-5xl mb-4">🍃</div>
      <p class="text-dali-mountain font-sans">暂无匹配的活动</p>
      <p class="text-sm text-dali-mountain/60 font-sans mt-1">换个分类试试？</p>
    </div>

    <!-- Info Sources -->
    <div class="mt-12 p-5 bg-white/60 rounded-xl border border-dali-gold/20">
      <h3 class="font-bold text-dali-terracotta mb-3 flex items-center gap-2">
        <span>📌</span> 信息源
      </h3>
      <p class="text-sm text-dali-mountain font-sans mb-3">关注这些渠道获取最新活动动态：</p>
      <div class="grid grid-cols-2 md:grid-cols-3 gap-2 text-sm font-sans">
        <div class="bg-dali-warm/50 rounded-lg px-3 py-2">公众号「大理旅游」</div>
        <div class="bg-dali-warm/50 rounded-lg px-3 py-2">公众号「大理好在」</div>
        <div class="bg-dali-warm/50 rounded-lg px-3 py-2">公众号「大理融媒」</div>
        <div class="bg-dali-warm/50 rounded-lg px-3 py-2">小红书@八十岁之前统治宇宙</div>
        <div class="bg-dali-warm/50 rounded-lg px-3 py-2">世外融合部落小红书</div>
        <div class="bg-dali-warm/50 rounded-lg px-3 py-2">公众号「大理Eco House」</div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-dali-gold/20 mt-8 py-6">
    <div class="max-w-4xl mx-auto px-4 text-center text-sm text-dali-mountain/60 font-sans">
      <p>🦋 大理活动日历 · 数据来自公开信息源 · 仅供参考</p>
      <p class="mt-1">活动信息可能有变动，请以官方发布为准</p>
    </div>
  </footer>

  <!-- Event Detail Modal -->
  <div id="event-modal" class="fixed inset-0 z-50 hidden">
    <div class="modal-overlay absolute inset-0 bg-black/40" onclick="closeModal()"></div>
    <div class="absolute bottom-0 left-0 right-0 md:bottom-auto md:top-1/2 md:left-1/2 md:-translate-x-1/2 md:-translate-y-1/2 md:max-w-lg md:w-full bg-dali-cream rounded-t-2xl md:rounded-2xl max-h-[85vh] overflow-y-auto shadow-2xl">
      <div class="p-6" id="modal-content">
        <!-- Generated by JS -->
      </div>
    </div>
  </div>

  <script>
    // --- Data & State ---
    let allEvents = [];
    let activeCategory = '全部';

    const CATEGORIES = ['全部', '民俗节庆', '市集', '音乐现场', '讲座沙龙', '亲子活动', '展览', '户外', '其他'];
    const CATEGORY_ICONS = {
      '全部': '🌟', '民俗节庆': '🔥', '市集': '🌿', '音乐现场': '🎸',
      '讲座沙龙': '🎓', '亲子活动': '🌻', '展览': '🖼', '户外': '🌸', '其他': '✨'
    };
    const CATEGORY_COLORS = {
      '民俗节庆': 'bg-red-100 text-red-700 border-red-200',
      '市集': 'bg-green-100 text-green-700 border-green-200',
      '音乐现场': 'bg-purple-100 text-purple-700 border-purple-200',
      '讲座沙龙': 'bg-blue-100 text-blue-700 border-blue-200',
      '亲子活动': 'bg-yellow-100 text-yellow-700 border-yellow-200',
      '展览': 'bg-pink-100 text-pink-700 border-pink-200',
      '户外': 'bg-emerald-100 text-emerald-700 border-emerald-200',
      '其他': 'bg-gray-100 text-gray-700 border-gray-200',
    };

    const WEEKDAYS = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

    // --- Long-term event detection ---
    function isLongTerm(event) {
      // Events spanning >7 days, or tagged with 长期/常驻/每周/每晚
      const tags = event.tags || [];
      if (tags.includes('长期') || tags.includes('常驻') || tags.includes('每周') || tags.includes('每晚')) return true;
      const start = new Date(event.date_start + 'T00:00:00');
      const end = new Date(event.date_end + 'T00:00:00');
      const days = (end - start) / (1000 * 60 * 60 * 24);
      return days > 7;
    }

    // --- Date helpers ---
    function getRelevantDates(event) {
      // For short-term events: return dates from today through next 14 days
      // For long-term events: return empty (shown in separate section)
      if (isLongTerm(event)) return [];
      const dates = [];
      const start = new Date(event.date_start + 'T00:00:00');
      const end = new Date(event.date_end + 'T00:00:00');
      const today = new Date();
      today.setHours(0,0,0,0);
      const limit = new Date(today);
      limit.setDate(limit.getDate() + 14);
      const current = new Date(Math.max(start.getTime(), today.getTime()));
      while (current <= end && current <= limit) {
        dates.push(`${current.getFullYear()}-${String(current.getMonth()+1).padStart(2,'0')}-${String(current.getDate()).padStart(2,'0')}`);
        current.setDate(current.getDate() + 1);
      }
      return dates;
    }

    // --- Init ---
    async function init() {
      try {
        const resp = await fetch('data/events.json');
        const data = await resp.json();
        allEvents = data.events || [];
        document.getElementById('last-updated').textContent = formatDateTime(data.last_updated);
      } catch(e) {
        console.error('Failed to load events', e);
        allEvents = [];
      }
      renderFilters();
      renderAll();
    }

    // --- Rendering ---
    function renderFilters() {
      const bar = document.getElementById('filter-bar');
      bar.innerHTML = CATEGORIES.map(cat => `
        <button class="category-pill px-3 py-1.5 rounded-full text-sm font-medium whitespace-nowrap border transition-all
          ${activeCategory === cat
            ? 'bg-dali-terracotta text-white border-dali-terracotta active shadow-sm'
            : 'bg-white text-dali-mountain border-dali-gold/30 hover:border-dali-terracotta/50'
          }" onclick="setCategory('${cat}')">
          ${CATEGORY_ICONS[cat] || ''} ${cat}
        </button>
      `).join('');
    }

    function setCategory(cat) {
      activeCategory = cat;
      renderFilters();
      renderAll();
    }

    function getFilteredEvents() {
      if (activeCategory === '全部') return allEvents;
      return allEvents.filter(e => e.category === activeCategory);
    }

    function renderAll() {
      const events = getFilteredEvents();
      const today = getTodayStr();

      // Split into long-term and short-term
      const longTermEvents = events.filter(e => isLongTerm(e));
      const shortTermEvents = events.filter(e => !isLongTerm(e));

      // Only show events that haven't ended
      const todayDate = new Date();
      todayDate.setHours(0,0,0,0);
      const activeLongTerm = longTermEvents.filter(e => new Date(e.date_end + 'T00:00:00') >= todayDate);
      const activeShortTerm = shortTermEvents.filter(e => new Date(e.date_end + 'T00:00:00') >= todayDate);

      // Date range for header (based on short-term event dates in next 14 days)
      const upcomingDates = [...new Set(activeShortTerm.flatMap(e => getRelevantDates(e)))].sort();
      const longTermRange = activeLongTerm.length > 0 ? `常驻${activeLongTerm.length}个` : '';
      if (upcomingDates.length > 0) {
        const rangeText = `${formatDateShort(today)} - ${formatDateShort(upcomingDates[upcomingDates.length - 1])}`;
        document.getElementById('date-range').textContent = longTermRange ? `${rangeText} · ${longTermRange}` : rangeText;
      } else if (longTermRange) {
        document.getElementById('date-range').textContent = longTermRange;
      }
      document.getElementById('event-count').textContent = activeShortTerm.length + activeLongTerm.length;

      // Featured (tags include 年度重磅)
      const featured = activeShortTerm.filter(e => e.tags && e.tags.includes('年度重磅'));
      const featuredSection = document.getElementById('featured-section');
      if (featured.length > 0) {
        featuredSection.classList.remove('hidden');
        document.getElementById('featured-events').innerHTML = featured.map(e => renderCard(e, true)).join('');
      } else {
        featuredSection.classList.add('hidden');
      }

      // Today's short-term events
      const todayShortEvents = activeShortTerm.filter(e => {
        const dates = getRelevantDates(e);
        return dates.includes(today);
      });
      const todaySection = document.getElementById('today-section');
      if (todayShortEvents.length > 0 && !todayShortEvents.every(e => featured.includes(e))) {
        todaySection.classList.remove('hidden');
        const todayD = new Date();
        document.getElementById('today-label').textContent =
          `今天 ${todayD.getMonth()+1}月${todayD.getDate()}日 ${WEEKDAYS[todayD.getDay()]}`;
        const nonFeaturedToday = todayShortEvents.filter(e => !featured.includes(e));
        document.getElementById('today-events').innerHTML = nonFeaturedToday.map(e => renderCard(e)).join('');
      } else {
        todaySection.classList.add('hidden');
      }

      // Long-term / standing events section
      let longTermHtml = '';
      if (activeLongTerm.length > 0) {
        longTermHtml = `
          <div class="mb-8 fade-in">
            <h2 class="text-lg font-bold text-dali-gold mb-3 flex items-center gap-2">
              <span>🏯</span> 常驻推荐
              <span class="text-xs font-normal text-dali-mountain/50 ml-1">长期可参加</span>
            </h2>
            <div class="space-y-3">
              ${activeLongTerm.map(e => renderCard(e, false, true)).join('')}
            </div>
          </div>
        `;
      }

      // Group short-term events by date (only upcoming dates)
      const grouped = {};
      activeShortTerm.forEach(e => {
        getRelevantDates(e).forEach(d => {
          if (!grouped[d]) grouped[d] = [];
          if (!grouped[d].find(x => x.id === e.id)) grouped[d].push(e);
        });
      });

      const sortedDates = Object.keys(grouped).sort();
      const listEl = document.getElementById('events-list');
      const emptyEl = document.getElementById('empty-state');

      if (sortedDates.length === 0 && activeLongTerm.length === 0) {
        listEl.innerHTML = '';
        emptyEl.classList.remove('hidden');
        return;
      }
      emptyEl.classList.add('hidden');

      const dailyHtml = sortedDates.map(date => {
        const dayEvents = grouped[date];
        const isToday = date === today;
        const d = new Date(date + 'T00:00:00');
        const label = isToday ? '📌 今天' :
          `${d.getMonth()+1}月${d.getDate()}日 ${WEEKDAYS[d.getDay()]}`;

        return `
          <div class="fade-in">
            <h2 class="text-base font-bold ${isToday ? 'text-dali-sky' : 'text-dali-mountain'} mb-3 flex items-center gap-2 font-sans">
              <span class="w-2 h-2 rounded-full ${isToday ? 'bg-dali-sky' : 'bg-dali-gold'}"></span>
              ${label}
              <span class="text-xs font-normal text-dali-mountain/50 ml-1">${dayEvents.length}个活动</span>
            </h2>
            <div class="space-y-3">
              ${dayEvents.map(e => renderCard(e)).join('')}
            </div>
          </div>
        `;
      }).join('');

      listEl.innerHTML = longTermHtml + dailyHtml;
    }

    function renderCard(event, isFeatured = false, isStanding = false) {
      const catColor = CATEGORY_COLORS[event.category] || CATEGORY_COLORS['其他'];
      const priceTag = event.price === '免费'
        ? '<span class="bg-green-100 text-green-700 px-1.5 py-0.5 rounded text-xs font-medium">免费</span>'
        : `<span class="text-xs text-dali-mountain/70">${event.price}</span>`;

      // Date display for long-term events
      let dateDisplay = event.time;
      if (isStanding && event.date_start !== event.date_end) {
        const s = new Date(event.date_start + 'T00:00:00');
        const e = new Date(event.date_end + 'T00:00:00');
        dateDisplay = `${s.getMonth()+1}/${s.getDate()} - ${e.getMonth()+1}/${e.getDate()} · ${event.time}`;
      }

      return `
        <div class="event-card ${isFeatured ? 'featured-glow' : ''} bg-white rounded-xl border border-dali-gold/20 overflow-hidden cursor-pointer"
             onclick="openModal('${event.id}')">
          <div class="p-4">
            <div class="flex items-start justify-between gap-3">
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 mb-1 flex-wrap">
                  <span class="text-xs px-2 py-0.5 rounded-full border ${catColor} font-sans">${event.category}</span>
                  ${priceTag}
                  ${isFeatured ? '<span class="bg-dali-terracotta/10 text-dali-terracotta px-2 py-0.5 rounded text-xs font-bold font-sans">重磅</span>' : ''}
                  ${isStanding ? '<span class="bg-dali-gold/20 text-dali-gold px-2 py-0.5 rounded text-xs font-bold font-sans">常驻</span>' : ''}
                </div>
                <h3 class="font-bold text-base text-gray-800 leading-tight">${event.title}</h3>
                <div class="mt-2 space-y-1 font-sans text-sm text-dali-mountain">
                  <div class="flex items-center gap-1.5">
                    <span>⏰</span> <span>${dateDisplay}</span>
                  </div>
                  <div class="flex items-center gap-1.5">
                    <span>📍</span> <span class="truncate">${event.location}</span>
                  </div>
                </div>
              </div>
              <div class="text-dali-gold/60 text-lg">›</div>
            </div>
            ${event.tags && event.tags.length > 0 ? `
              <div class="mt-2 flex flex-wrap gap-1">
                ${event.tags.slice(0, 4).map(t => `<span class="text-xs text-dali-mountain/50 bg-dali-warm/50 px-1.5 py-0.5 rounded font-sans">#${t}</span>`).join('')}
              </div>
            ` : ''}
          </div>
        </div>
      `;
    }

    function openModal(eventId) {
      const event = allEvents.find(e => e.id === eventId);
      if (!event) return;

      const catColor = CATEGORY_COLORS[event.category] || CATEGORY_COLORS['其他'];
      const d = new Date(event.date_start + 'T00:00:00');
      const dateLabel = `${d.getMonth()+1}月${d.getDate()}日 ${WEEKDAYS[d.getDay()]}`;

      const endDate = event.date_end !== event.date_start ?
        ` - ${new Date(event.date_end+'T00:00:00').getMonth()+1}月${new Date(event.date_end+'T00:00:00').getDate()}日` : '';

      document.getElementById('modal-content').innerHTML = `
        <div class="flex items-center justify-between mb-4">
          <span class="text-xs px-2.5 py-1 rounded-full border ${catColor} font-sans font-medium">${event.category}</span>
          <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-dali-warm text-dali-mountain font-sans">✕</button>
        </div>

        <h2 class="text-xl font-bold text-gray-800 mb-4 leading-tight">${event.title}</h2>

        <div class="space-y-3 mb-5 font-sans text-sm">
          <div class="flex items-start gap-3">
            <span class="text-dali-terracotta mt-0.5">📅</span>
            <div>
              <div class="font-medium text-gray-800">${dateLabel}${endDate}</div>
              <div class="text-dali-mountain">${event.time}</div>
            </div>
          </div>
          <div class="flex items-start gap-3">
            <span class="text-dali-terracotta mt-0.5">📍</span>
            <div>
              <div class="font-medium text-gray-800">${event.location}</div>
              ${event.location_map ? `<div class="text-dali-mountain text-xs">${event.location_map}</div>` : ''}
            </div>
          </div>
          <div class="flex items-start gap-3">
            <span class="text-dali-terracotta mt-0.5">💰</span>
            <div class="font-medium text-gray-800">${event.price}</div>
          </div>
        </div>

        <p class="text-sm text-dali-mountain leading-relaxed mb-4 font-sans">${event.description}</p>

        ${event.highlights && event.highlights.length > 0 ? `
          <div class="mb-4">
            <h4 class="text-sm font-bold text-dali-terracotta mb-2 font-sans">✨ 亮点</h4>
            <div class="space-y-1">
              ${event.highlights.map(h => `
                <div class="flex items-center gap-2 text-sm text-dali-mountain font-sans">
                  <span class="w-1.5 h-1.5 rounded-full bg-dali-gold flex-shrink-0"></span>
                  ${h}
                </div>
              `).join('')}
            </div>
          </div>
        ` : ''}

        ${event.tips ? `
          <div class="bg-dali-warm/50 rounded-lg p-3 mb-4">
            <div class="text-sm font-bold text-dali-terracotta mb-1 font-sans">💡 Tips</div>
            <div class="text-sm text-dali-mountain font-sans">${event.tips}</div>
          </div>
        ` : ''}

        ${event.source_url ? `
          <a href="${event.source_url}" target="_blank" rel="noopener"
             class="block w-full text-center py-2.5 bg-dali-terracotta/10 hover:bg-dali-terracotta/20 text-dali-terracotta rounded-lg text-sm font-medium transition-colors font-sans">
            查看来源 →
          </a>
        ` : ''}
      `;

      document.getElementById('event-modal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('event-modal').classList.add('hidden');
      document.body.style.overflow = '';
    }

    // --- Helpers ---
    function getTodayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    // getEventDates removed - replaced by isLongTerm + getRelevantDates

    function formatDateShort(dateStr) {
      const d = new Date(dateStr + 'T00:00:00');
      return `${d.getMonth()+1}/${d.getDate()}`;
    }

    function formatDateTime(isoStr) {
      if (!isoStr) return '未知';
      const d = new Date(isoStr);
      return `${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }

    // ESC to close modal
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal();
    });

    // Init
    init();
  </script>
</body>
</html>
